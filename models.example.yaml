# Multi-model configuration for PC Shopping Assistant AI Service.
# Copy and customize for your deployment, then set AI_MODELS_CONFIG_PATH to this file.
# Secrets must stay in .env / .env.docker and be referenced via *_env fields.

default_model: gemini-2.5-flash

models:
  - id: gemini-2.5-flash
    label: "Gemini 2.5 Flash"
    provider: gemini
    model_name: gemini-2.5-flash
    api_key_env: AI_GEMINI_API_KEY
    max_output_tokens: 4096
    timeout_seconds: 120
    thinking:
      strategy: gemini_reasoning
      supported_modes: [off, low, medium, high]
      default_mode: low

  - id: gemini-3.1-flash-lite
    label: "Gemini 3.1 Flash Lite"
    provider: gemini
    model_name: gemini-3.1-flash-lite
    api_key_env: AI_GEMINI_API_KEY
    max_output_tokens: 4096
    timeout_seconds: 120
    thinking:
      strategy: gemini_reasoning
      supported_modes: [minimal, low, medium, high]
      default_mode: medium

  - id: qwen3.5-9b-ollama
    label: "Qwen 3.5 9B (Ollama)"
    provider: openai
    model_name: qwen3.5:9b-q4_K_M
    base_url_env: AI_OPENAI_BASE_URL
    api_key_env: AI_OPENAI_API_KEY
    api_key_optional: true
    max_output_tokens: 4096
    timeout_seconds: 180
    thinking:
      strategy: ollama_think
      supported_modes: [off, on]
      default_mode: on
