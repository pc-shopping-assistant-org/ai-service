name: Build and publish AI image

on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/heads/release/') }}

permissions:
  contents: read

jobs:
  verify:
    name: Verify Python service
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AI_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/ai_ci
      AI_TEST_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/ai_ci
    services:
      postgres:
        image: postgres:18.3-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.3'
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Run lint
        run: uv run --no-sync ruff check src tests integration_tests migrations

      - name: Run typecheck
        run: uv run --no-sync mypy src

      - name: Run core tests
        run: uv run --no-sync pytest -q

      - name: Initialize isolated test database
        run: |
          uv run --no-sync alembic upgrade head
          uv run --no-sync python -m ai_service.bootstrap_stateful

      - name: Run PostgreSQL integration tests
        run: uv run --no-sync pytest -q integration_tests

  image:
    name: Build image
    needs: verify
    if: >-
      startsWith(github.ref, 'refs/heads/release/') &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve image version from release branch
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#release/v}
          version_pattern='(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.[1-9][0-9]*)?'
          [[ "$GITHUB_REF_NAME" == release/v* && "$version" =~ ^${version_pattern}$ ]] || { echo 'Use release/vX.Y.Z or release/vX.Y.Z-rc.N' >&2; exit 2; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=sha,format=long,prefix=sha-

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  propose:
    name: Propose AI image for production
    needs: image
    if: github.event_name == 'push'
    uses: pc-shopping-assistant-org/infra/.github/workflows/propose-image.yml@release/production
    with:
      component: ai
      release_branch: ${{ github.ref_name }}
    secrets:
      INFRA_RELEASE_PR_TOKEN: ${{ secrets.INFRA_RELEASE_PR_TOKEN }}
