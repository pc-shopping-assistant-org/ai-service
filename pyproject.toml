[project]
name = "ai-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "lamdx4", email = "dagxuanlam@gmail.com" }
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "langgraph>=1.0,<2",
    "langchain-openai>=1.0,<2",
    "langchain-google-genai>=4.0,<5",
    "pydantic-settings>=2.15.0",
    "uvicorn>=0.52.4",
    "langgraph-checkpoint-postgres>=3.1.2",
    "psycopg[binary,pool]>=3.3.6",
    "sqlalchemy[asyncio]>=2.1.3",
    "alembic>=1.20.0",
    "pyjwt[crypto]>=2.13.0",
    "greenlet>=3.5.6",
    "trafilatura>=2.3.1",
    "opentelemetry-sdk>=1.39,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.39,<2",
    "opentelemetry-instrumentation-logging>=0.66b1,<1",
]

[project.scripts]
ai-service = "ai_service.main:run"
ai-index-catalog = "ai_service.index_catalog:run"
ai-bootstrap-stateful = "ai_service.bootstrap_stateful:run"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.4",
]
training = [
    "accelerate>=1.14.0",
    "bitsandbytes>=0.49,<1",
    "datasets>=5.0.1",
    "peft>=0.20.0",
    "torch>=2.13.0",
    "transformers>=5.15.1",
    "trl>=1.10.0",
]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_untyped_fields = true
